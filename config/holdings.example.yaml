# 실제 보유 수량을 적어 두면, 매달 '목표 비중보다 부족한 종목'부터 채우도록 매수 계획을 짭니다.
# 사용법: 이 파일을 config/holdings.yaml로 복사한 뒤 수량을 고쳐 주세요.
# (Claude에게 "이번 달 리포트대로 샀어"라고 말하면 대신 갱신해 줍니다.)
# 기존 적립금(본인 IRP 약 1,000만 원)은 요청에 따라 이 계획에서 제외했습니다.

me:            # 본인 IRP (신한투자증권)
  cash: 0      # 계좌에 남아 있는 현금(원). 지난달 남은 돈 포함
  shares:      # 종목코드: 보유 수량(주)
    # "360750": 3

spouse:        # 남편 IRP (우리투자증권)
  cash: 0
  shares: {}
